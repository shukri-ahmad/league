<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makerobot LEAGUE - Live Standings</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red-gear: #e72429;
            --blue-gear: #1f4179;
            --league-grad: linear-gradient(90deg, #1f4179 0%, #00ff88 100%);
            --league-accent: #00ff88;
            --bg-dark: #090c10;
            --panel-bg: #111822;
            --border-glow: #1f4179;
            --text-main: #c9d1d9;
            --neon-green: #00ff88;
        }

        body { font-family: 'Rajdhani', sans-serif; background-color: var(--bg-dark); color: var(--text-main); margin: 0; padding: 20px; background-image: radial-gradient(circle at 50% 0%, rgba(0, 255, 136, 0.05) 0%, transparent 50%); }
        .container { max-width: 1000px; margin: 0 auto; background: var(--panel-bg); padding: 20px 30px; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.8); border: 1px solid var(--border-glow); margin-bottom: 30px; }
        
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; text-align: center; color: white; letter-spacing: 1px; text-transform: uppercase; margin-top: 0;}
        
        .header-links { text-align: right; margin-bottom: 10px; }
        .header-links a { color: var(--league-accent); text-decoration: none; font-weight: bold; font-family: 'Orbitron', sans-serif; font-size: 14px; text-transform: uppercase; transition: color 0.3s;}
        .header-links a:hover { color: white; text-shadow: 0 0 8px white; }
        
        .game-selector { text-align: center; margin-bottom: 25px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 8px; border: 1px solid #30363d; }
        .game-selector select { padding: 10px; font-size: 16px; border-radius: 4px; font-weight: bold; width: 50%; background: #0d1117; color: white; border: 1px solid var(--border-glow); font-family: 'Rajdhani', sans-serif; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 18px; }
        th, td { padding: 15px 12px; text-align: center; border-bottom: 1px solid #30363d; vertical-align: middle;}
        th { background: var(--league-grad); color: black; font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 1px; font-weight: 900;}
        
        .rank-1 { background: rgba(0, 255, 136, 0.1) !important; }
        .rank-1 td { color: #fff; font-weight: bold; text-shadow: 0 0 5px var(--league-accent); }
        
        .team-name { font-weight: bold; text-align: left; padding-left: 20px; font-size: 1.2em; color: white;}
        .win-box { font-size: 1.2em; font-weight: bold; color: var(--league-accent); text-shadow: 0 0 8px rgba(0,255,136,0.4); }
        .formula-text { text-align: center; font-size: 14px; color: #8b949e; margin-top: -10px; margin-bottom: 20px; font-weight: bold;}
        
        .history-section-title { margin-top: 50px; margin-bottom: 10px; text-align: left; color: var(--league-accent); border-bottom: 1px solid #30363d; padding-bottom: 10px; font-size: 20px;}
        .public-round-header { background: #0d1117; padding: 10px; margin-top: 30px; border-radius: 4px; border-left: 4px solid var(--league-accent); color: white; font-family: 'Orbitron', sans-serif; font-weight: bold; text-align: left; border-top: 1px solid #30363d; border-right: 1px solid #30363d; border-bottom: 1px solid #30363d;}
        .match-divider td { background-color: #30363d; height: 1px; padding: 0; border: none; opacity: 0.5; }
        
        .tie-badge { color: var(--red-gear); font-size: 11px; display: block; font-weight: bold; margin-top: 5px;}
        
        /* TIMER UI */
        .public-timer-container { display: none; text-align: center; background: #000; padding: 15px; border: 2px solid var(--league-accent); border-radius: 12px; margin-bottom: 25px; box-shadow: 0 0 30px rgba(0, 255, 136, 0.2); }
        .public-timer-display { font-size: 90px; font-family: 'Orbitron', sans-serif; color: var(--neon-green); font-weight: 900; text-shadow: 0 0 25px rgba(0,255,136,0.6); line-height: 1;}
        .public-timer-display.paused { color: #f39c12; text-shadow: 0 0 25px rgba(243, 156, 18, 0.6); }
        .public-timer-display.stopped { color: var(--red-gear); text-shadow: 0 0 25px rgba(231, 36, 41, 0.6); }
    </style>
</head>
<body>

<div class="container">
    <div class="header-links"><a href="login.html">[ ADMIN TERMINAL ]</a></div>
    
    <div style="text-align: center; margin-bottom: 10px;">
        <img src="[FINAL] LOGO MAKEROBOT2026 (9)-Photoroom.png" alt="Logo" style="max-width: 250px;">
        <h2 style="font-size: 32px; color: var(--league-accent); margin-top: 10px;">MAKEROBOT LEAGUE</h2>
        <div style="font-family: 'Orbitron', sans-serif; font-size: 14px; color: #8b949e; letter-spacing: 2px;">LIVE SEASON STANDINGS</div>
    </div>
    
    <div class="game-selector">
        <label for="publicGameSelect" style="font-weight: bold; display: block; margin-bottom: 8px; color: #8b949e; font-family: 'Orbitron', sans-serif;">SELECT LEAGUE</label>
        <select id="publicGameSelect" onchange="loadSelectedGame()"><option>INITIALIZING...</option></select>
    </div>

    <!-- PUBLIC MATCH TIMER -->
    <div id="publicTimerUI" class="public-timer-container">
        <div style="color: #8b949e; font-size: 16px; font-weight: bold; letter-spacing: 4px; font-family: 'Orbitron', sans-serif; margin-bottom: 5px;">OFFICIAL MATCH TIMER</div>
        <div id="publicTimeClock" class="public-timer-display">00:00</div>
    </div>

    <p class="formula-text">RANKED BY: HIGHEST POINTS (WINS/DRAWS) ➔ LEAST BALLS LEFT</p>
    
    <table>
        <thead>
            <tr>
                <th>RANK</th>
                <th>TEAM</th>
                <th>POINTS</th>
                <th>TOTAL BALLS LEFT</th>
            </tr>
        </thead>
        <tbody id="leaderboard-body"><tr><td colspan="4">AWAITING DATA...</td></tr></tbody>
    </table>

    <h3 class="history-section-title">LEAGUE SCHEDULE</h3>
    <div id="matches-history-container">
        <p style="text-align: center; color: #8b949e;">Awaiting schedule generation...</p>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, doc, onSnapshot, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDiJ0mtythPveASgwkQy_CdUEEAiDMVn9A",
    authDomain: "makerobot-league.firebaseapp.com",
    projectId: "makerobot-league",
    storageBucket: "makerobot-league.firebasestorage.app",
    messagingSenderId: "535133602491",
    appId: "1:535133602491:web:f461c378707863d8f9df9e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let unsubGameDoc = null;
  let unsubTeams = null;
  let unsubMatches = null;

  // --- AUDIO SYNTHESIZER FOR VIEWERS ---
  let audioCtx = null;
  function getAudioCtx() {
      if (!audioCtx) {
          try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } 
          catch (e) { console.warn("Audio Context not supported."); }
      }
      return audioCtx;
  }

  function playSound(type) {
      const ctx = getAudioCtx();
      if (!ctx) return;
      if (ctx.state === 'suspended') ctx.resume();
      
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === 'start') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(880, ctx.currentTime);
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          osc.start(); osc.stop(ctx.currentTime + 0.6);
      } else if (type === 'tick') {
          osc.type = 'square'; osc.frequency.setValueAtTime(440, ctx.currentTime);
          gain.gain.setValueAtTime(0.01, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
          osc.start(); osc.stop(ctx.currentTime + 0.1);
      } else if (type === 'end') {
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, ctx.currentTime);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          osc.start(); osc.stop(ctx.currentTime + 1.5);
      }
  }

  document.addEventListener('click', () => {
      const ctx = getAudioCtx();
      if (ctx && ctx.state === 'suspended') ctx.resume();
  }, { once: true });


  // --- TIMER LOGIC FOR VIEWER ---
  let localTimerInterval = null;
  let endSoundPlayed = false;
  let lastTickSecond = -1;

  function formatTime(ms) {
      if (ms < 0) ms = 0;
      let totalSeconds = Math.floor(ms / 1000);
      let m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
      let s = (totalSeconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
  }

  function renderTimerUI(game) {
      const display = document.getElementById("publicTimeClock");
      if (!game.timerState) return; 

      if (game.timerState === 'idle' || game.timerState === 'paused') {
          clearInterval(localTimerInterval);
          display.innerText = formatTime(game.timerRemaining);
          display.className = game.timerState === 'paused' ? 'public-timer-display paused' : 'public-timer-display';
          endSoundPlayed = false;
      } 
      else if (game.timerState === 'running') {
          display.className = 'public-timer-display';
          clearInterval(localTimerInterval);
          
          localTimerInterval = setInterval(() => {
              let now = Date.now();
              let remaining = game.timerEndTime - now;
              
              if (remaining <= 0) {
                  remaining = 0;
                  clearInterval(localTimerInterval);
                  display.className = 'public-timer-display stopped';
                  if (!endSoundPlayed) {
                      playSound('end');
                      endSoundPlayed = true;
                  }
              } else {
                  let currentSecond = Math.floor(remaining / 1000);
                  if (currentSecond !== lastTickSecond && currentSecond <= 10 && currentSecond > 0) {
                      playSound('tick');
                      lastTickSecond = currentSecond;
                  }
              }
              display.innerText = formatTime(remaining);
          }, 50);
      }
  }

  async function loadGamesList() {
      const selectElement = document.getElementById("publicGameSelect");
      const gamesSnap = await getDocs(collection(db, "games"));
      selectElement.innerHTML = "";
      if(gamesSnap.empty) return selectElement.innerHTML = "<option>NO LEAGUES FOUND</option>";

      gamesSnap.forEach(documentDoc => { 
          selectElement.innerHTML += `<option value="${documentDoc.id}">${documentDoc.data().name}</option>`; 
      });
      loadSelectedGame();
  }
  loadGamesList();

  window.loadSelectedGame = function() {
      const gameId = document.getElementById("publicGameSelect").value;
      if(!gameId || gameId === "NO LEAGUES FOUND") return;

      if(unsubGameDoc) unsubGameDoc();
      if(unsubTeams) unsubTeams();
      if(unsubMatches) unsubMatches();

      unsubGameDoc = onSnapshot(doc(db, "games", gameId), (docSnap) => {
          if (docSnap.exists()) {
              const gameData = docSnap.data();
              if (gameData.timerState) {
                  document.getElementById("publicTimerUI").style.display = "block";
                  renderTimerUI(gameData);
                  if (gameData.timerState === 'running' && !localTimerInterval) {
                      playSound('start');
                  }
              } else {
                  document.getElementById("publicTimerUI").style.display = "none";
              }
          }
      });

      unsubTeams = onSnapshot(collection(db, "games", gameId, "teams"), (snapshot) => {
        let teams = [];

        snapshot.forEach(documentDoc => {
            teams.push({ id: documentDoc.id, ...documentDoc.data() });
        });

        teams.sort((a, b) => {
            if ((b.points || 0) !== (a.points || 0)) return (b.points || 0) - (a.points || 0);
            return (a.balls || 0) - (b.balls || 0); 
        });

        let currentRank = 1;
        teams.forEach((t, i) => {
            if (i > 0) {
                let prev = teams[i-1];
                if (prev.points !== t.points || prev.balls !== t.balls) currentRank = i + 1;
            }
            t.rank = currentRank;
            
            let tiedWithPrev = (i > 0 && teams[i-1].points === t.points && teams[i-1].balls === t.balls);
            let tiedWithNext = (i < teams.length - 1 && teams[i+1].points === t.points && teams[i+1].balls === t.balls);
            t.isTied = tiedWithPrev || tiedWithNext;
        });
        
        const tbody = document.getElementById("leaderboard-body");
        tbody.innerHTML = ""; 
        if (teams.length === 0) return tbody.innerHTML = "<tr><td colspan='4'>NO TEAMS REGISTERED.</td></tr>";

        teams.forEach((team, index) => {
          let tieHTML = team.isTied ? `<span class="tie-badge">[TIE]</span>` : '';
            
          tbody.innerHTML += `
            <tr class="${index === 0 && (team.points > 0 || team.balls > 0) ? 'rank-1' : ''}">
              <td style="font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.2em;">${team.rank} ${tieHTML}</td>
              <td class="team-name">${team.name}</td>
              <td class="win-box">${team.points || 0}</td>
              <td style="font-family: 'Orbitron', sans-serif; font-weight: bold;">${team.balls || 0}</td>
            </tr>`;
        });
      });

      const qMatches = query(collection(db, "games", gameId, "matches"), orderBy("round", "asc"));
      unsubMatches = onSnapshot(qMatches, (snapshot) => {
          const container = document.getElementById("matches-history-container");
          container.innerHTML = "";
          
          if (snapshot.size === 0) {
              container.innerHTML = `<p style="text-align: center; color: #8b949e;">Schedule generating...</p>`;
              return;
          }

          let roundsData = {};
          let maxRound = 0;

          snapshot.forEach(docSnap => {
              const match = docSnap.data();
              if(match.round > maxRound) maxRound = match.round;
              if(!roundsData[match.round]) roundsData[match.round] = [];
              roundsData[match.round].push(match);
          });

          for (let r = 1; r <= maxRound; r++) {
              if (!roundsData[r]) continue;
              
              let html = `<div class="public-round-header">MATCHDAY ${r}</div>`;
              html += `<table><thead><tr><th>MATCH</th><th>TEAM A</th><th>SCORE</th><th>TEAM B</th></tr></thead><tbody>`;
              
              roundsData[r].forEach((match, index) => {
                  let aBalls = match.teamA_balls === null ? "-" : match.teamA_balls;
                  let bBalls = match.teamB_balls === null ? "-" : match.teamB_balls;
                  
                  let scoreRender = `<span style="color:#8b949e;">[ VS ]</span>`;
                  let aColor = "white", bColor = "white";

                  if (match.teamB_id === "BYE") {
                      html += `
                      <tr>
                          <td style="font-family: 'Orbitron', sans-serif; font-weight: bold; width: 15%;">#${index+1}</td>
                          <td class="team-name" style="color: var(--neon-green); width: 35%; text-align: right; padding-right:15px;">${match.teamA_name}</td>
                          <td style="font-weight: bold; font-family: 'Orbitron', sans-serif; width: 15%; color: var(--neon-green);">+2 PTS</td>
                          <td class="team-name" style="color: #8b949e; width: 35%;">( BYE )</td>
                      </tr>
                      <tr class="match-divider"><td colspan="4"></td></tr>`;
                      return; 
                  }

                  if (match.teamA_balls !== null && match.teamB_balls !== null) {
                      scoreRender = `<span style="font-weight:900;">${aBalls} - ${bBalls}</span>`;
                      if (match.teamA_balls < match.teamB_balls) {
                          aColor = "var(--neon-green)"; bColor = "var(--red-gear)";
                      } else if (match.teamB_balls < match.teamA_balls) {
                          aColor = "var(--red-gear)"; bColor = "var(--neon-green)";
                      } else {
                          aColor = "#f39c12"; bColor = "#f39c12";
                      }
                  }

                  html += `
                      <tr>
                          <td style="font-family: 'Orbitron', sans-serif; font-weight: bold; width: 15%;">#${index+1}</td>
                          <td class="team-name" style="color: ${aColor}; width: 35%; text-align: right; padding-right:15px;">${match.teamA_name}</td>
                          <td style="font-size: 1.2em; width: 15%;">${scoreRender}</td>
                          <td class="team-name" style="color: ${bColor}; width: 35%;">${match.teamB_name}</td>
                      </tr>
                      <tr class="match-divider"><td colspan="4"></td></tr>
                  `;
              });
              html += `</tbody></table>`;
              container.innerHTML += html;
          }
      });
  };
</script>

</body>
</html>
